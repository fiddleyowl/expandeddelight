plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def withKubeJS = providers.gradleProperty('withKubeJS').map { it.toBoolean() }.getOrElse(false)

dependencies {
    compileOnly "maven.modrinth:kubejs:$kubejs_version"
    if (withKubeJS) {
        runtimeOnly "maven.modrinth:kubejs:$kubejs_version"
        runtimeOnly "maven.modrinth:rhino:2101.2.8-build.91+Rhino-1.21"
        runtimeOnly "maven.modrinth:better-advanced-tooltips:2601.1.0-build.11"
    }
    implementation "curse.maven:farmers-delight-26-neo-ver-1699768:$farmers_delight_file_id"
    compileOnly "mezz.jei:jei-$minecraft_version-common-api:$jei_version"
    compileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
    runtimeOnly "mezz.jei:jei-$minecraft_version-neoforge:$jei_version"
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    portTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    portTestImplementation.extendsFrom implementation
    portTestCompileOnly.extendsFrom compileOnly
    portTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (providers.gradleProperty('portSmoke').isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', 'expanded-delight-port-smoke'
                systemProperty 'expandeddelight.clientSmoke', 'true'
            }

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file(withKubeJS ? "run-gametest-kubejs" : "run-gametest")
            systemProperty "expandeddelight.testKubeJS", withKubeJS.toString()
            programArguments.addAll "--tests", "expandeddelight:*", "--report", file(withKubeJS ? "build/port-gametest-kubejs.xml" : "build/port-gametest.xml").absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.portTest)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.named('processResources', ProcessResources).configure {
    def metadata = [minecraft_version_range: minecraft_version_range,
                    neo_version_range: neo_version_range, loader_version_range: loader_version_range,
                    mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                    mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(Jar).configureEach {
    from(['LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.txt', 'TEMPLATE_LICENSE.txt']) { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
}

if (withKubeJS) {
    def prepareKubeJSTest = tasks.register('prepareKubeJSTest', Copy) {
        from 'src/portTest/kubejs'
        into 'run-gametest-kubejs/kubejs'
    }
    tasks.named('runGameTestServer') { dependsOn prepareKubeJSTest }
}

if (providers.gradleProperty('portSmoke').isPresent()) {
    def prepareClientSmoke = tasks.register('prepareClientSmoke', Copy) {
        dependsOn 'runGameTestServer'
        from withKubeJS ? 'run-gametest-kubejs/gametestserver/gametestworld' : 'run-gametest/gametestserver/gametestworld'
        into 'run/saves/expanded-delight-port-smoke'
    }
    tasks.named('runClient') { dependsOn prepareClientSmoke }
}
